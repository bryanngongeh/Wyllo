services:
  postgres:
    ports: !reset []
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wyllo}
      POSTGRES_USER: ${POSTGRES_USER:-wyllo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong POSTGRES_PASSWORD}

  redis:
    ports: !reset []
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set a strong REDIS_PASSWORD}

  migrate:
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-wyllo}:${POSTGRES_PASSWORD:?Set a strong POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-wyllo}

  api:
    ports: !reset []
    environment:
      NODE_ENV: production
      CORS_ORIGINS: ${CORS_ORIGINS:?Set exact HTTPS application origins}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:?Set the Auth0 tenant domain}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:?Set the Auth0 API audience}
      DATABASE_URL: postgres://${POSTGRES_USER:-wyllo}:${POSTGRES_PASSWORD:?Set a strong POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-wyllo}
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set a strong REDIS_PASSWORD}@redis:6379/0
      MODULE_CATALOG_PUBLIC_KEY: ${MODULE_CATALOG_PUBLIC_KEY:?Set the release public key}
      MODULE_CATALOG_SIGNATURE: ${MODULE_CATALOG_SIGNATURE:?Set the signed module catalogue}
      ALLOW_DEMO_MODULES: "false"

  web:
    build:
      args:
        VITE_AUTH0_DOMAIN: ${AUTH0_DOMAIN:?Set the Auth0 tenant domain}
        VITE_AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID:?Set the Auth0 SPA client id}
        VITE_AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:?Set the Auth0 API audience}
    environment:
      API_INTERNAL_URL: http://api:4174